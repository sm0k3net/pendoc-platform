name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx supabase@3.3.0 start
      - run: npx supabase@3.3.0 db reset
      - run: docker exec -i supabase_db_pendoc-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/access_policy.sql

  community-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sm0k3net/pendoc-platform'
    needs: [frontend, database]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: initial-community-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the first verified community version
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "PenDoc Platform 0.1.0" --prerelease \
            --notes "First community preview. Includes the reporting workspace, client access controls, private evidence, and installation guides in English and Russian. Validate deployment and restore procedures in a dedicated environment before importing production material."
